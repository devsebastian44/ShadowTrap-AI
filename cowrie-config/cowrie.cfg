[honeypot]
# Hostname displayed to attackers
hostname = prod-server-01

# Listening addresses
listen_endpoints = tcp:2222:interface=0.0.0.0

# Backend (shell simulation)
backend = shell

# Log format
[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json

[output_textlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.log

[ssh]
# Fake SSH version string
version = SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.6
rsa_public_key = etc/ssh_host_rsa_key.pub
rsa_private_key = etc/ssh_host_rsa_key
dsa_public_key = etc/ssh_host_dsa_key.pub
dsa_private_key = etc/ssh_host_dsa_key

# Delay login to simulate real server
auth_class = UserDB
auth_class_parameters = etc/userdb.txt

# Max auth attempts before disconnect
auth_attempts = 5

# Interaction timeouts (seconds)
interactive_timeout = 180
authentication_timeout = 120

[telnet]
enabled = false

[shell]
# Filesystem path for fake shell
filesystem = ${honeypot:share_path}/fs.pickle
processes = ${honeypot:share_path}/cmdoutput.json

# Fake system info
arch = linux-x86_64-lsb

[download]
# Capture files downloaded by attackers
enabled = true
dir = ${honeypot:state_path}/downloads

[database_jsonlog]
enabled = true
