image: python:3.10

stages:
  - lint
  - security
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

linting:
  stage: lint
  script:
    - pip install ruff
    - ruff check backend/
    - ruff format --check backend/

security_audit:
  stage: security
  script:
    - pip install pip-audit
    - pip-audit -r backend/requirements.txt || echo "Ignoring known unpatched vulns for lab"

# Placeholder for future tests
test:
  stage: test
  script:
    - echo "Running pytest..."
